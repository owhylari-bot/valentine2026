<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#a46bba"><title>Para Lari, com amor 💜</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--purple:#82529e;--pink:#d96698;--ink:#53395c;--muted:#806d86;--lavender:#e8d7f5;--white:#fffafc}*{box-sizing:border-box}body{margin:0;min-height:100dvh;font-family:'DM Sans',sans-serif;color:var(--ink);background:linear-gradient(125deg,#f6cee4,#e7dbfa 53%,#fcdde9);background-size:220% 220%;animation:bg 16s ease infinite;display:flex;align-items:center;justify-content:center;padding:30px 16px;overflow-x:hidden}@keyframes bg{50%{background-position:100% 100%}}.float{position:fixed;pointer-events:none;z-index:0;opacity:.55;font-size:24px;animation:float 13s linear infinite}@keyframes float{0%{transform:translateY(105vh) rotate(0)}100%{transform:translateY(-130vh) rotate(35deg)}}main{position:relative;z-index:1;width:min(100%,700px);background:rgba(255,253,255,.93);border:1px solid #ffffffcb;border-radius:30px;box-shadow:0 16px 60px #885b9930;padding:clamp(24px,5vw,46px);text-align:center;backdrop-filter:blur(10px)}h1{font:normal clamp(38px,7vw,58px)/1.2 'Great Vibes',cursive;color:var(--purple);margin:4px 0 8px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700;color:#ad79a7}.progress{height:7px;border-radius:99px;background:#f3e7f7;margin:20px 0 32px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#e88cae,#9767bc);border-radius:99px;transition:width .4s}.step{animation:enter .45s ease}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}h2{font-size:clamp(22px,4.5vw,29px);line-height:1.35;margin:0 0 16px;color:#6b407d}p{line-height:1.75}.sub{color:var(--muted);font-size:14px;margin:0 0 24px}.buttons{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin:24px 0 8px;min-height:70px}button{font:700 15px 'DM Sans',sans-serif;cursor:pointer;border:0;border-radius:999px;padding:14px 24px;min-height:48px;transition:background .2s,transform .2s,box-shadow .2s}button:focus-visible{outline:3px solid #8c67c9;outline-offset:3px}.primary{background:linear-gradient(100deg,#db6c9c,#9b68bf);color:white;box-shadow:0 7px 20px #b06eac49}.primary:hover{transform:translateY(-2px);box-shadow:0 10px 23px #b06eac50}.secondary{background:#f0e3f7;color:#6d4482}.secondary:hover{background:#e7d3f3}.ghost{background:transparent;color:var(--purple);text-decoration:underline}.secret{display:block;margin:20px auto 4px;background:#fbf2fa;border:1px dashed #c996cd;color:#9f7aa9;font-size:13px;padding:12px 18px;opacity:.48}.secret:hover,.secret:focus{opacity:1}.hint{font-size:12px;color:#a18ba6}.card{background:#fff6fb;border:1px solid #efd9ed;border-radius:20px;padding:20px;margin:20px 0;text-align:left}.letter{white-space:pre-line;text-align:left;max-height:min(45vh,340px);overflow:auto;padding:22px;border-radius:20px;background:#fff8fd;border:1px solid #ead7f0;box-shadow:inset 0 2px 15px #e6cfea40;font-size:15px}.memory-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.memory{background:linear-gradient(160deg,#f9e6f2,#ebe0fb);border:1px solid #e5ceec;border-radius:18px;min-height:98px;padding:12px 6px;color:#694779;font-size:14px}.memory .emoji{display:block;font-size:26px;margin-bottom:5px}.memory.opened{background:#f8eefc}.memory-text{margin:18px 0;white-space:pre-line;color:#664a71}.meter{width:100%;accent-color:#b56abb;margin:20px 0 10px;cursor:pointer;height:23px}.value{font-size:36px;font-weight:700;color:var(--pink);margin:12px 0}.response{min-height:38px;font-weight:700;color:#9d5b9e}.music{position:fixed;top:13px;right:13px;z-index:5;background:#fffbffeb;color:#82529e;border:1px solid #dcbfdf;padding:10px 15px;font-size:12px;min-height:40px}.sticker{font-size:53px;margin:4px 0 20px}.no-response{background:#fff0f6;border-radius:16px;padding:15px;margin-top:14px}.signature{font:normal 30px 'Great Vibes',cursive;color:var(--purple);text-align:right;margin:6px 2px}.small{font-size:12px;color:#9b829f}.hidden{display:none!important}.confetti{position:fixed;z-index:15;pointer-events:none;animation:pop 4s linear forwards}@keyframes pop{0%{opacity:1;transform:translateY(-20px) rotate(0)}100%{opacity:0;transform:translateY(110vh) rotate(360deg)}}@media(max-width:480px){main{padding:23px 19px;border-radius:24px}.memory-grid{grid-template-columns:1fr}.memory{min-height:55px}.buttons{flex-direction:column}.buttons button{width:100%}.letter{max-height:42vh}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* Efeitos extras: corações, cartas e botões brincalhões */
.sticker{display:inline-block;animation:heartbeat 2.5s ease-in-out infinite;transform-origin:center}
@keyframes heartbeat{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.16) rotate(4deg)}}
.memory{transition:transform .25s ease,box-shadow .25s ease,background .25s ease}
.memory:hover,.memory:focus-visible{transform:translateY(-5px) rotate(-1deg);box-shadow:0 8px 18px #a76fa530}
.letter{animation:letterOpen .75s ease both}
@keyframes letterOpen{from{opacity:0;transform:translateY(17px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.secret{transition:opacity .25s,transform .25s,background .25s}
.secret:hover,.secret:focus-visible{transform:scale(1.045);background:#f2ddf5}
[data-action="tease"]{transition:transform .16s ease,background .2s,box-shadow .2s;will-change:transform}
.response:not(:empty){animation:letterOpen .35s ease}
@media(prefers-reduced-motion:reduce){.sticker,.letter,.step,.float{animation:none!important}button,.memory{transition:none!important}}

/* Atualização surpresa: interatividade roxa e rosa */
.buttons.playground{position:relative;display:flex;justify-content:flex-start;align-items:flex-start;min-height:225px;overflow:hidden;border-radius:20px;background:linear-gradient(120deg,#fff6fb,#f2eafa);padding:15px}
.playground .primary{position:relative;z-index:1}
.playground [data-action=tease]{z-index:2;transition:left .15s ease,top .15s ease,transform .15s ease}
.secret{opacity:.8;border:2px dashed #bb79bd;background:#f6e5f8;box-shadow:0 0 0 3px #fbecf6;animation:secretGlow 2.2s ease-in-out infinite}
@keyframes secretGlow{50%{box-shadow:0 0 18px #e4a5df;transform:scale(1.02)}}
.secret-revealed{background:#f6e5f7;padding:13px;border-radius:15px;animation:letterOpen .35s ease}
.meter-heart{font-size:54px;display:inline-block;margin:14px 0 19px;transition:transform .12s ease,filter .12s ease;transform-origin:center}
.meter-track-decoration{height:12px;width:0;margin:-6px 0 13px;border-radius:999px;background:linear-gradient(90deg,#ff9abd,#af79d7);transition:width .12s ease}
.memory{position:relative;min-height:147px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;transition:transform .6s cubic-bezier(.2,.8,.2,1),background .4s}
.memory .emoji{font-size:32px}.memory .flip-label{font-size:11px;opacity:.76}.memory.opened{background:linear-gradient(135deg,#fff5fc,#e9d8fb);transform:rotateY(360deg)}.memory-reveal{animation:letterOpen .6s ease}
.envelope-zone{position:relative;margin:24px auto;max-width:560px;min-height:230px;perspective:900px}
.envelope{position:relative;width:min(90%,360px);height:195px;display:block;margin:5px auto 22px;border-radius:8px;background:linear-gradient(145deg,#f6c5df,#cda8e8);box-shadow:0 16px 30px #9869a14f;overflow:hidden;transition:transform 1s,opacity .6s;cursor:pointer}
.envelope:before{content:'';position:absolute;inset:0;clip-path:polygon(0 100%,50% 42%,100% 100%);background:#f2b4d2}
.envelope-flap{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 61%);background:#e7a5ce;transform-origin:top;transition:transform 1s;z-index:2}
.envelope-heart{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);font-size:38px;z-index:3}.envelope-label{position:absolute;bottom:12px;left:0;right:0;font-size:12px;color:#64355d;z-index:3}
.opened-envelope .envelope{transform:translateY(-20px) scale(.89);opacity:.72}.opened-envelope .envelope-flap{transform:rotateX(160deg)}
.paper{background:#fffefd;border:1px solid #eacddd;box-shadow:0 16px 34px #a878ad45;max-width:540px;text-align:left;padding:clamp(18px,4vw,35px);border-radius:5px;margin:-22px auto 16px;position:relative;animation:paperOut 1.1s cubic-bezier(.2,.8,.2,1) both;max-height:380px;overflow:auto}
@keyframes paperOut{from{opacity:0;transform:translateY(-80px) scale(.83)}to{opacity:1;transform:translateY(0) scale(1)}}
.paper-head{font:normal 26px 'Great Vibes',cursive;color:#935ba2;margin-bottom:15px}
.typed-letter{font-size:14px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}.type-cursor{color:#b061a8;animation:blink .7s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.suspense-line{font-size:clamp(21px,4vw,29px);font-weight:700;color:#b052a3;padding:25px 5px;animation:heartbeat 2s ease infinite}
@media(max-width:480px){.buttons.playground{min-height:240px}.playground button{width:auto;max-width:70%}.paper{max-height:52vh}.memory-grid{grid-template-columns:1fr}.memory{min-height:95px}}
@media(prefers-reduced-motion:reduce){.secret,.suspense-line{animation:none!important}.paper{animation:none!important}}
</style>
</head>
<body>
<button class="music" id="musicButton" type="button">🎵 Tocar música</button>
<audio id="brunoSong" loop preload="none" src="audio/bruno.mp3.mp3"></audio>
<audio id="demiSong" loop preload="none" src="audio/demi.mp3.mp3"></audio>
<main><div class="eyebrow" id="chapter">Uma surpresa só sua</div><h1>Para minha Lari ♡</h1><div class="progress"><div id="bar" style="width:0%"></div></div><div id="screen" aria-live="polite"></div><p class="small">Feito com todo o amor do mundo 💜</p></main>
<script>
// 💌 PERSONALIZAÇÃO: altere os textos abaixo quando quiser.
const messages={
firstQuestion:'Meu amor, você gosta de mim? 🥹❤️',
secondQuestion:'Tá, mas gosta de mim MESMO ou só tá me iludindo? 🤨💕',
proposal:'Larissa Marcela Dos Santos Rocha, você aceita ser minha namorada e continuar escrevendo a nossa história comigo? 💍❤️',
letter:`Meu amor,\n\nSe alguém me dissesse que uma ligação no Discord mudaria tanta coisa na minha vida, eu nem imaginaria. No começo, eram conversas sem nenhuma pretensão, depois vieram as jogatinas, as risadas e essa vontade cada vez maior de estar pertinho de você.\n\nHoje, esperar você chegar em casa é uma das partes mais gostosas do meu dia. Sua voz me acalma, suas risadas me fazem sorrir sem perceber e nossas calls de soninho são pequenos momentos que eu guardo com muito carinho.\n\nVocê esteve comigo até nos dias em que pensei em desistir de tantas coisas, e me fez querer voltar, tentar mais uma vez e acreditar que dias bonitos ainda viriam.\n\nEu amo a mulher que você é: seu carinho, sua inteligência, seus sonhos e até suas manias. Quero continuar conhecendo cada pedacinho seu, respeitando seus momentos e construindo uma relação bonita, leve e cheia de parceria.\n\nNão sei explicar o tamanho do meu amor, mas sei que quero demonstrá-lo nas pequenas coisas, todos os dias. Eu te amo, minha gatinha. ❤️`,
final:`Meu amor, hoje eu quero guardar essa data no coração: 26/10/2026. 💍❤️\n\nA garota que entrou na minha vida por uma call se tornou meu pensamento favorito, meu sorriso inesperado e alguém com quem eu sonho viver um montão de coisas bonitas.\n\nEu quero ser seu abraço nos dias difíceis, a pessoa que comemora suas vitórias e a companhia para os momentos mais bobos. Quero continuar descobrindo o mundo com você, uma risada, uma conversa e um carinho por vez.\n\nNão prometo uma história perfeita. Prometo sinceridade, cuidado, diálogo e vontade de escolher nós duas todos os dias.\n\nObrigada por existir e por me deixar fazer parte da sua vida. Eu te amo mais do que qualquer medidor conseguiria mostrar. Em todas as vidas em que eu pudesse escolher, eu procuraria você. ❤️`
};
const memories=[['🎮','Nossas jogatinas','Tudo começou com conversas e partidas de Valorant. Sem perceber, fomos criando algo só nosso.'],['🎧','Nossas calls','As ligações, as risadas e nossas calls de soninho viraram alguns dos meus lugares favoritos.'],['🏡','O melhor horário','Aquele friozinho bom de esperar você chegar em casa, porque sei que mais um pedacinho do dia será com você.']];
const $=s=>document.querySelector(s);let stage=0,memoryOpened=new Set(),meterValue=100,teaseCount=0,meterCelebrated=false;
const stages=['Primeira perguntinha','Preciso confirmar uma coisa','Medidor oficial de amor','Três pedacinhos da nossa história','Uma carta do meu coração','Última brincadeira','Um segredo muito importante','O grande momento','Nosso capítulo'];
function btn(label,action,cls='primary'){return `<button type="button" class="${cls}" data-action="${action}">${label}</button>`}
function setStage(n){if(proposalTimer){clearTimeout(proposalTimer);proposalTimer=null;}const previousStage=stage;stage=n;$('#chapter').textContent=stages[n];$('#bar').style.width=(n/8*100)+'%';render();updateSoundtrack(previousStage,n);window.scrollTo({top:0,behavior:'smooth'})}
function render(){const el=$('#screen');let html='';switch(stage){
case 0:html=`<section class="step"><div class="sticker">🧸💗</div><h2>${messages.firstQuestion}</h2><p class="sub">Responde com sinceridade, hein! 🤨</p><div class="buttons">${btn('Simmm! ❤️','next')}${btn('Nem, saí fora 🙄','tease','secondary')}</div>${btn('🤫 Uma resposta secreta (toque aqui)','secret','secret')}<p class="hint">O segredinho está visível… mas só se revela quando você toca 🤫</p><p class="response" id="tease"></p><p class="response" id="secretText" aria-live="polite"></p></section>`;break;
case 1:html=`<section class="step"><div class="sticker">🤨💕</div><h2>${messages.secondQuestion}</h2><p class="sub">Pensa direitinho antes de responder KKKKK.</p><div class="buttons">${btn('EU TE AMO, BOBA! ❤️','next')}${btn('Tô pensando... 👀','tease','secondary')}</div>${btn('💌 Tem um segredo pra você (toque aqui)','secret','secret')}<p class="response" id="tease"></p><p class="response" id="secretText" aria-live="polite"></p></section>`;break;
case 2:html=`<section class="step"><div class="sticker">💘</div><h2>Tá bom, então prova! Quanto você me ama?</h2><p class="sub">Arrasta o medidor. Quero provas matemáticas desse amor! 🤭</p><div class="meter-heart" id="meterHeart" aria-hidden="true">💗</div><input class="meter" aria-label="Medidor de amor" id="meter" type="range" min="0" max="10000" value="${meterValue}" step="10"><div class="meter-track-decoration" id="meterFill"></div><div class="value" id="meterNumber">${meterValue.toLocaleString('pt-BR')}%</div><p class="response" id="meterMessage">${meterText(meterValue)}</p>${btn('Já provei meu amor! 💖','next')}</section>`;break;
case 3:html=`<section class="step"><div class="sticker">🎁</div><h2>Antes de continuar, abre nossas memórias!</h2><p class="sub">Clique nos três corações para descobrir o que eu guardo com carinho. 💗</p><div class="memory-grid">${memories.map((m,i)=>`<button class="memory ${memoryOpened.has(i)?'opened':''}" data-memory="${i}"><span class="emoji">${memoryOpened.has(i)?m[0]:'🔒💌'}</span><span>${memoryOpened.has(i)?m[1]:'Memória secreta '+(i+1)}</span><span class="flip-label">${memoryOpened.has(i)?'Descoberta ♡':'Toque para revelar ✨'}</span></button>`).join('')}</div><p class="hint" id="memoryCounter">${memoryOpened.size}/3 memórias descobertas 💗</p><div class="card memory-text" id="memoryText">${memoryOpened.size===3?'Você abriu todas as memórias. Mas ainda temos tantas pela frente! 💜':'Cada lembrança tem um cantinho especial no meu coração.'}</div>${memoryOpened.size===3?btn('Quero ler a carta 💌','next'): '<p class="hint">Abra os três corações para continuar.</p>'}</section>`;break;
case 4:html=`<section class="step"><div class="sticker">💌</div><h2>Uma cartinha para você, meu amor</h2><p class="sub">Escrevi pensando em tudo o que a gente viveu até aqui.</p><div class="envelope-zone" id="envelopeZone"><button class="envelope" data-action="openEnvelope" aria-label="Abrir envelope com carta"><span class="envelope-flap"></span><span class="envelope-heart">💌</span><span class="envelope-label">Toque para abrir o envelope 💜</span></button><div class="paper hidden" id="paper"><div class="paper-head">Para minha Lari, com todo meu amor ♡</div><div class="typed-letter" id="typedLetter" aria-live="off"></div><span class="type-cursor" id="typeCursor">▌</span><div class="signature hidden" id="letterSign">Com amor, sua Duda ♡</div></div></div><div class="buttons hidden" id="letterControls">${btn('Mostrar a carta completa 💌','finishTyping','secondary')}${btn('Terminei de ler, amor ❤️','next')}</div></section>`;break;
case 5:html=`<section class="step"><div class="sticker">💋</div><h2>E agora, meu amor… você acha mesmo que vai se livrar de mim? Dos meus carinhos, do meu amor, da minha chatice (só às vezes, tá? 🤭) e, principalmente, de todo o cuidado que eu tenho com o meu amorzinho? 💗</h2><div class="buttons">${btn('NUNCAAA! ❤️','next')}${btn('Socorro, vou fugir! 🏃‍♀️','tease','secondary')}</div><p class="response" id="tease"></p><p class="hint">Tem gente tentando fugir de um montão de amor por aqui!</p></section>`;break;
case 6:html=`<section class="step suspense"><div class="sticker">💫💌</div><h2>Espera… tem mais uma coisinha.</h2><p class="sub">Depois de tantas risadas, lembranças e palavras, chegamos à parte que fez meu coração disparar enquanto eu preparava tudo isso.</p><div class="suspense-line">E agora… o momento mais esperado… 💜</div><p>Respira comigo, meu amor. Tenho uma pergunta muito importante para você.</p>${btn('Estou pronta para descobrir 💍','next')}</section>`;break;
case 7:html=`<section class="step"><div class="sticker">🌹💍</div><h2>${messages.proposal}</h2><p class="sub">A resposta é sua, sem botão fugindo agora. Eu só quero que venha do seu coração. ❤️</p><div class="buttons">${btn('CLAROOO, MEU AMOR! ❤️','accept')}${btn('Quero conversar 💜','decline','secondary')}</div><div class="no-response hidden" id="declineMessage">Tudo bem, meu amor. Obrigada por ser sincera comigo. O mais importante é a gente conversar com carinho, sem pressa e sem pressão. 💜</div></section>`;break;
case 8:html=`<section class="step"><div class="sticker">💍🎉💗</div><h2>26/10/2026 — Nosso capítulo especial!</h2><p>EU TE AMOOOO! 😭❤️</p><p class="sub">Ainda tenho mais uma coisinha guardada pra você...</p>${btn('Abrir meu último presente 💝','finalLetter')}<div class="hidden" id="finalLetter"><div class="letter" style="margin-top:20px">${escapeHtml(messages.final)}</div><div class="signature">Sua namorada, Duda ♡</div>${btn('Recomeçar nossa surpresinha 💗','restart','secondary')}</div></section>`;break;
}el.innerHTML=html;if(stage===2){updateMeterVisual();$('#meter').addEventListener('input',e=>{meterValue=Number(e.target.value);updateMeterVisual();$('#meterNumber').textContent=meterValue.toLocaleString('pt-BR')+'%';$('#meterMessage').textContent=meterText(meterValue);if(meterValue>=9000&&!meterCelebrated){meterCelebrated=true;burst(28)}if(meterValue<7000)meterCelebrated=false})}}
function updateMeterVisual(){const scale=(0.75+meterValue/10000*1.45).toFixed(2);const h=$('#meterHeart');const f=$('#meterFill');if(h){h.style.transform=`scale(${scale}) rotate(${Math.round(meterValue/1000)*3}deg)`;h.style.filter=`drop-shadow(0 5px ${8+meterValue/700}px #cf67b4aa)`;}if(f)f.style.width=(meterValue/100)+'%';}
function meterText(v){return v>=9000?'MEU DEOS! ESSE AMOR NÃO CABE NO UNIVERSO! 😭💗🚀':v>=5000?'MEO DEOSSS, DO TAMANHO DO MUNDÃO! 🥹💞':v>=1000?'DO INFINITO E ALÉM! 🚀💖':v>100?'Ai que gostosinho saber disso! 🥰':'Só isso, amor? 🤨💕'}
function escapeHtml(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function burst(count=45){for(let i=0;i<count;i++){let d=document.createElement('div');d.className='confetti';d.textContent=['💜','💕','💗','✨','💍'][i%5];d.style.left=(Math.random()*100)+'vw';d.style.top='-30px';d.style.fontSize=(18+Math.random()*20)+'px';d.style.animationDelay=(Math.random()*1.3)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),5700)}}
// No computador, os botões de brincadeira fogem ao aproximar o mouse.
// No celular, continuam clicáveis e mostram as mensagens secretas.
let lastDodge=0,dodgeCount=0,typingTimer=null,typingIndex=0;
// Botões brincalhões: quanto mais tentam, mais longe fogem, sem fugir da tela.
function dodge(b, pointerX){
  const area=b.closest('.buttons');if(!area)return;
  if(!area.classList.contains('playground')){area.classList.add('playground');b.style.position='absolute';b.style.left=Math.max(0,area.clientWidth-b.offsetWidth)/2+'px';b.style.top='85px';}
  dodgeCount++;
  const maxX=Math.max(0,area.clientWidth-b.offsetWidth-8);
  const maxY=Math.max(0,area.clientHeight-b.offsetHeight-6);
  const oldX=parseFloat(b.style.left)||0;
  let x=Math.random()*maxX;
  if(Math.abs(x-oldX)<Math.min(95,maxX/3))x=(oldX<maxX/2?maxX:0);
  const y=Math.random()*maxY;
  b.style.left=x+'px';b.style.top=y+'px';
  b.style.transform=`rotate(${(Math.random()-.5)*24}deg) scale(${Math.max(.76,1-dodgeCount*.012)})`;
  const msg=$('#tease');if(msg)msg.textContent=[
    'UÉ, CADÊ O BOTÃO? KKKKK 🤭','QUASE! Mas ele correu mais rápido! 💨',
    'O segredo tá brilhando logo ali, viu? 🤫','Eu sabia que você ia insistir! 🤣💜',
    'Tá difícil dizer não pra mim, né? 🥹💕'
  ][dodgeCount%5];
}
$('#screen').addEventListener('pointermove',e=>{
 if(e.pointerType!=='mouse'||!matchMedia('(hover:hover)').matches)return;
 const b=$('#screen [data-action="tease"]');if(!b)return;
 const r=b.getBoundingClientRect();
 const dx=Math.max(r.left-e.clientX,0,e.clientX-r.right),dy=Math.max(r.top-e.clientY,0,e.clientY-r.bottom);
 if(Math.hypot(dx,dy)<80&&Date.now()-lastDodge>200){lastDodge=Date.now();dodge(b,e.clientX)}
});
function finishTyping(){if(typingTimer)clearInterval(typingTimer);typingTimer=null;typingIndex=messages.letter.length;const el=$('#typedLetter');if(el)el.textContent=messages.letter;$('#letterSign')?.classList.remove('hidden');$('#typeCursor')?.classList.add('hidden');const skip=$('[data-action="finishTyping"]');if(skip)skip.classList.add('hidden')}
function startTyping(){const paper=$('#paper');paper.classList.remove('hidden');$('#envelopeZone').classList.add('opened-envelope');$('#letterControls').classList.remove('hidden');typingIndex=0;$('#typedLetter').textContent='';const env=$('.envelope');env.disabled=true;env.setAttribute('aria-label','Envelope aberto');if(typingTimer)clearInterval(typingTimer);typingTimer=setInterval(()=>{const chunk=messages.letter.slice(typingIndex,typingIndex+3);typingIndex+=chunk.length;const box=$('#typedLetter');if(!box){clearInterval(typingTimer);return}box.textContent+=chunk;if(typingIndex>=messages.letter.length)finishTyping()},26)}
$('#screen').addEventListener('click',e=>{let m=e.target.closest('[data-memory]');if(m){let i=Number(m.dataset.memory);memoryOpened.add(i);render();$('#memoryText').textContent=memories[i][2];$('#memoryText').classList.add('memory-reveal');burst(5);return}let b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='next'){if(typingTimer){clearInterval(typingTimer);typingTimer=null}if(stage===6){beginProposal();}else{setStage(stage+1)}}if(a==='skipReveal'){finishProposalReveal()}if(a==='secret'){const el=$('#secretText');if(el){el.textContent=stage===0?'EU NÃO GOSTO DE VOCÊ… EU TE AMO MUITOOOO! 😭❤️':'SEGREDO REVELADO: cada dia que passa eu me apaixono mais por você, my nenis! 💜';el.classList.add('secret-revealed');burst(9)}}if(a==='openEnvelope')startTyping();if(a==='finishTyping')finishTyping();if(a==='tease'){teaseCount++;if(!matchMedia('(hover:hover)').matches)dodge(b); const hints=stage===0?['Eita, esse botão é tímido! 🤭','Ele fugiu porque sabe que você me ama! 😌','A resposta secreta tá te esperando! 💕']:stage===1?['Pensando nada, eu vi esse sorrisinho! 😘','Achou mesmo que eu ia facilitar? KKKK 💜','Tem um segredinho ali embaixo! 💌']:['CORREEE, mas meu amor te alcança! 💋','Fugiu de novo? Tarde demais, roubou meu coração! 💘'];$('#tease').textContent=hints[(teaseCount-1)%hints.length];if(teaseCount%3===0)$('#tease').textContent+=' (Tá, pode clicar no SIM quando quiser!)';}if(a==='accept'){setStage(8);burst()}if(a==='decline')$('#declineMessage').classList.remove('hidden');if(a==='finalLetter'){$('#finalLetter').classList.remove('hidden');b.classList.add('hidden');burst()}if(a==='restart'){proposalRevealing=false;dodgeCount=0;memoryOpened.clear();meterValue=100;teaseCount=0;meterCelebrated=false;setStage(0)}});
// TRILHA SONORA: usa os nomes já enviados ao GitHub: audio/bruno.mp3.mp3 e audio/demi.mp3.mp3.
const bruno=$('#brunoSong'),demi=$('#demiSong'),musicBtn=$('#musicButton');
let musicEnabled=false,fadeTimer=null,proposalTimer=null,proposalRevealing=false;
const defaultVolume=.56;
function stopFade(){if(fadeTimer!==null){clearInterval(fadeTimer);fadeTimer=null}}
function volumeForStage(n){return n===4?.28:n===6?.34:defaultVolume}
function updateMusicLabel(){musicBtn.textContent=musicEnabled?'🔇 Pausar música':'🎵 Tocar nossa música'}
function fadeTo(audio,target,duration=900){
  stopFade();const from=audio.volume,started=performance.now();
  fadeTimer=setInterval(()=>{const progress=Math.min(1,(performance.now()-started)/duration);audio.volume=Math.max(0,Math.min(1,from+(target-from)*progress));if(progress>=1)stopFade()},40);
}
// Troca musical sincronizada com o momento do pedido, não com minutos fixos.
function updateSoundtrack(oldStage,newStage){
  if(!musicEnabled)return;
  if(newStage===7 && oldStage!==7 && demi.paused){
    stopFade();const duration=5000,start=performance.now(),brunoFrom=bruno.volume;
    demi.volume=0;
    demi.play().then(()=>{
      fadeTimer=setInterval(()=>{
        const t=Math.min(1,(performance.now()-start)/duration);
        bruno.volume=Math.max(0,brunoFrom*(1-t));demi.volume=defaultVolume*t;
        if(t>=1){stopFade();bruno.pause();}
      },40);
    }).catch(()=>{demi.pause();demi.volume=0;fadeTo(bruno,defaultVolume);musicBtn.textContent='🎵 Verificar áudio da Demi';});
    return;
  }
  if(newStage<7 && demi.paused){fadeTo(bruno,volumeForStage(newStage))}
  if(newStage===8 && !demi.paused){demi.volume=defaultVolume}
  if(newStage===0 && !demi.paused){demi.pause();demi.currentTime=0;bruno.currentTime=0;bruno.volume=defaultVolume;bruno.play().catch(()=>{});}
}

// Revelação: a introdução da Demi acompanha o suspense antes da pergunta.
// A voz entra aproximadamente entre 11 e 13 segundos da gravação enviada.
// O usuário pode antecipar a revelação; nenhuma ação depende do cronômetro.
function finishProposalReveal(){
  if(!proposalRevealing)return;
  proposalRevealing=false;
  if(proposalTimer){clearTimeout(proposalTimer);proposalTimer=null;}
  setStage(7);
}
function beginProposal(){
  if(proposalRevealing)return;
  proposalRevealing=true;
  const view=$('#screen');
  view.innerHTML=`<section class="step suspense"><div class="sticker">💫💜</div><h2>É agora, meu amor…</h2><p class="sub">Aquela ligação no Discord foi só o começo da nossa história.</p><div class="suspense-line">E agora… o momento mais esperado… 💍</div><p>Tem uma pergunta que meu coração queria te fazer.</p>${btn('Revelar o pedido 💍','skipReveal','secondary')}</section>`;
  // Inicia a música neste clique real, para respeitar os bloqueios de reprodução.
  if(musicEnabled){
    stopFade();
    demi.pause();demi.currentTime=0;demi.volume=0;
    const beginning=performance.now(),brunoFrom=bruno.paused?0:bruno.volume;
    demi.play().then(()=>{
      fadeTimer=setInterval(()=>{
        const t=Math.min(1,(performance.now()-beginning)/5000);
        if(!bruno.paused)bruno.volume=Math.max(0,brunoFrom*(1-t));
        demi.volume=Math.min(1,defaultVolume*t);
        if(t>=1){stopFade();bruno.pause();demi.volume=defaultVolume;}
      },40);
    }).catch(()=>{
      // Se o navegador não permitir a segunda faixa, preserve a primeira.
      demi.pause();demi.volume=0;
      if(!bruno.paused)bruno.volume=defaultVolume;
      musicBtn.textContent='🎵 Toque para ativar o som';
      musicEnabled=false;
    });
  }
  proposalTimer=setTimeout(finishProposalReveal,12000);
}

musicBtn.addEventListener('click',async()=>{
  if(musicEnabled){musicEnabled=false;stopFade();bruno.pause();demi.pause();updateMusicLabel();return;}
  const target=stage>=7?demi:bruno;const other=stage>=7?bruno:demi;
  other.pause();target.volume=stage>=7?defaultVolume:volumeForStage(stage);
  try{await target.play();musicEnabled=true;updateMusicLabel()}
  catch{musicEnabled=false;musicBtn.textContent='⚠️ Verificar arquivos de música'}
});
updateMusicLabel();
for(let i=0;i<22;i++){const d=document.createElement('div');d.className='float';d.textContent=['💜','💕','💗','✨','🩷'][i%5];d.style.left=(i*47%100)+'%';d.style.animationDelay=(-i*.8)+'s';d.style.animationDuration=(11+i%7)+'s';document.body.appendChild(d)}
render();
</script>
